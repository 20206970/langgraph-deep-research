[project]
name = "langgraph-deep-research"
version = "0.0.1"
description = "Deep research assistant powered by LangGraph with memory management"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-chroma>=0.1.0",
    "langchain-community>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "hf-xet>=1.1.0",
    "sentence-transformers>=3.0.0",
    "tavily-python>=0.5.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.0.0",
    "loguru>=0.7.3",
    "arxiv>=2.1.0",
    "httpx>=0.27.0",
    "langgraph-checkpoint-sqlite>=3.1.1,<3.2",
    "langsmith>=0.1.0",
    "python-multipart>=0.0.18",
    "PyJWT>=2.10.0",
    "bcrypt>=4.1.0",
    "docling>=2.0.0",
    "markitdown>=0.1.0",
    "Pillow>=10.0.0",
    "FlagEmbedding>=1.3.3",
    "chromadb>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
